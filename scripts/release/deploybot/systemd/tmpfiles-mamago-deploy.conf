# The lock is shared with the legacy deploy.sh (run by "user"); both must be able
# to take it, so it is always created owned by "user" and world readable.
f /tmp/mamago-deploy.lock 0644 user user -
# Age-based cleanup of /tmp must not remove it: whoever recreated it would own it
# and deploy.sh could no longer open it.
x /tmp/mamago-deploy.lock - - - -
