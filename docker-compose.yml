version: "3.9"
services:
  db:
    image: postgres:16
    container_name: mamago2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mamago
      POSTGRES_PASSWORD: mamago
      POSTGRES_DB: mamago2
    ports:
      - "5433:5432"
    volumes:
      - mamago2_pg:/var/lib/postgresql/data

  app:
    build: .
    container_name: mamago2-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mamago:mamago@db:5432/mamago2
      MEDIA_STORAGE_ROOT: /app/storage
    volumes:
      # Persist uploaded media files across container restarts/redeploys.
      # MEDIA_STORAGE_ROOT must point to this mounted directory.
      - mamago2_storage:/app/storage

volumes:
  mamago2_pg:
  mamago2_storage:
