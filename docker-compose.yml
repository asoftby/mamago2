version: "3.9"
services:
  db:
    image: postgres:16
    container_name: mamago2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mamago
      POSTGRES_PASSWORD: mamago
      POSTGRES_DB: mamago2
    ports:
      - "5433:5432"
    volumes:
      - mamago2_pg:/var/lib/postgresql/data

  app:
    build: .
    container_name: mamago2-app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mamago:mamago@db:5432/mamago2
      MEDIA_STORAGE_ROOT: /app/storage
    volumes:
      # Persist uploaded media files across container restarts/redeploys.
      # MEDIA_STORAGE_ROOT must point to this mounted directory.
      - mamago2_storage:/app/storage

  # Operations Center worker (§21 Step 2) — same image as `app`, different
  # command, no published port. One replica; the snapshot builder's
  # advisory lock keeps it safe under a temporary two-worker overlap during
  # rolling deploys. APP_PUBLIC_URL is the existing app-wide "public base
  # URL" var (see .env.example) — reused here rather than introducing a
  # differently-named duplicate for the same value.
  worker:
    build: .
    container_name: mamago2-worker
    command: ["node", "dist/worker/index.js"]
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mamago:mamago@db:5432/mamago2

volumes:
  mamago2_pg:
  mamago2_storage:
