name: Cleanup old GHCR images

on:
  schedule:
    - cron: '0 4 * * 0' # Каждое воскресенье в 4:00
  workflow_dispatch:    # Ручной запуск
    inputs:
      dry_run:
        description: "Preview cleanup without deleting images"
        required: true
        type: boolean
        default: true

jobs:
  cleanup-prod:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old Prod images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          owner-type: user
          package-name: 'mamago2'
          keep-at-most: 3
          filter-tags: 'prod-*'
          # Scheduled runs always perform the real cleanup (unchanged
          # behavior). A manual workflow_dispatch run defaults to a safe
          # dry-run (see the `dry_run` input's own `default: true`) and
          # only deletes if the operator explicitly sets it to false —
          # never left ambiguous/empty.
          dry-run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

  cleanup-dev:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old Dev images
        uses: quartx-analytics/ghcr-cleaner@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository-owner: ${{ github.repository_owner }}
          owner-type: user
          package-name: 'mamago2'
          keep-at-most: 3
          filter-tags: 'dev-*'
          dry-run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
