name: Temporary SEC-012 audit

on:
  push:
    branches:
      - fix/sec-012-dependency-advisories-20260923

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > audit.json
          code=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const advisories = Object.values(a.advisories || {}).map((x) => ({
            id: x.id,
            ghsa: x.github_advisory_id,
            module: x.module_name,
            severity: x.severity,
            title: x.title,
            vulnerable: x.vulnerable_versions,
            patched: x.patched_versions,
            cvss: x.cvss?.score ?? null,
            findings: (x.findings || []).map((f) => ({ version: f.version, paths: f.paths })),
          }));
          console.log('SEC012_AUDIT_BEGIN');
          console.log(JSON.stringify({metadata: a.metadata, advisories}, null, 2));
          console.log('SEC012_AUDIT_END');
          NODE
          echo "PNPM_AUDIT_EXIT=$code"
          exit 0
