name: B2B auth safe transform

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  transform:
    if: github.head_ref == 'refactor/b2b-auth-cleanup-20260901'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/b2b-auth-cleanup-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe canonical B2B transform
        run: node scripts/auth/canonicalize-b2b-gates-safe.mjs
      - name: Commit transformed API files
        run: |
          if git diff --quiet; then
            echo "No transform changes"
            exit 0
          fi
          git config user.name "asoftby"
          git config user.email "asoftby@gmail.com"
          git add src/app/api/business
          git commit -m "refactor(auth): remove remaining legacy B2B API gates"
          git fetch origin refactor/b2b-auth-cleanup-20260901
          git rebase origin/refactor/b2b-auth-cleanup-20260901
          git push origin HEAD:refactor/b2b-auth-cleanup-20260901
