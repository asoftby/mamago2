name: Docker Build & Push

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Обязательно: Настраиваем buildx драйвер для поддержки кэширования
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=prod-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TODO: restore dev minimum to 900 after legacy WordPress redirects are imported.
          build-args: |
            REDIRECT_MANIFEST_MIN_ROWS=${{ github.ref == 'refs/heads/dev' && '1' || '900' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
