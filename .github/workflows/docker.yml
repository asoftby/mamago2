name: Docker Build & Push

# Builds the application image exactly once, from `dev` — the canonical
# integration/release source. `main` intentionally has no build trigger
# here: promoting a build to PROD is a registry-side digest copy done by
# promote.yml (`docker buildx imagetools create`), never a rebuild. This
# workflow has no branch-conditional tagging logic left to re-enable a
# `main`-triggered rebuild by accident — see promote.yml for how a
# `prod-*` tag actually gets created.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Обязательно: Настраиваем buildx драйвер для поддержки кэширования
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "build_id=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev-${{ github.run_number }}
            type=raw,value=dev
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 850 = static WP map (893 rows in manifest.csv) with headroom for curation;
          # DB-derived slug_history rows only add on top.
          # NEXT_PUBLIC_* vars must be passed as build-args (not just runtime env
          # vars on the host) — Next.js inlines them into the client bundle at
          # `next build` time. This is the only build; the same image (same
          # NEXT_PUBLIC_* values baked in) is later promoted to prod-* by
          # promote.yml, so there is nothing further to pass at promotion time.
          build-args: |
            REDIRECT_MANIFEST_MIN_ROWS=850
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
            BUILD_ID=${{ steps.build_meta.outputs.build_id }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
