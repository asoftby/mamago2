name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Git task workflow regressions
        run: sh scripts/git/task-workflow.test.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mamago_ci

      - name: Business authorization architecture regressions
        run: |
          pnpm exec tsx src/lib/auth/businessEventAuthorizationWiring.test.ts
          pnpm exec tsx src/lib/auth/businessAuthorizationArchitecture.test.ts

      - name: Type check
        run: pnpm tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Cache architecture regressions
        run: |
          pnpm exec tsx src/server/article/publicArticleListCacheWiring.test.ts
          pnpm exec tsx src/server/discovery/discoveryHubExpandCacheWiring.test.ts

      - name: Stories playback regressions
        run: pnpm exec tsx src/features/stories/components/StoryProgress.test.tsx

      - name: Place wizard regressions
        run: |
          pnpm exec tsx src/components/business/wizard/place/config.test.ts
          pnpm exec tsx src/components/business/wizard/place/isPlaceAgeChipActive.test.ts
          pnpm exec tsx src/components/business/wizard/place/completion.test.ts
          pnpm exec tsx src/components/business/wizard/place/agePolicyValidation.test.ts
          pnpm exec tsx src/components/business/wizard/place/draftState.test.ts
          pnpm exec tsx src/components/business/wizard/place/placeSubcategorySelection.test.ts
          pnpm exec tsx src/components/business/wizard/place/steps/Step1Profile.test.tsx
          pnpm exec tsx src/components/business/wizard/place/steps/Step2Location.test.ts

      - name: Place geo overrides regressions
        run: |
          pnpm exec tsx src/lib/geo/haversineMeters.test.ts
          pnpm exec tsx src/components/business/place/placeLocationGeoOverrides.test.ts
          pnpm exec tsx src/components/business/place/PlaceLocationPicker.raceContract.test.ts
          pnpm exec tsx src/components/business/place/placeLocationPresentation.test.ts
          pnpm exec tsx src/components/business/place/PlaceLocationPicker.presentationWiring.test.ts

      - name: Event timezone contract regressions
        run: pnpm exec tsx src/lib/event/eventTimezoneContract.test.ts

      - name: Event recurring schedule regressions
        run: pnpm exec tsx src/lib/event/recurringScheduleMaterialization.test.ts

      - name: Event map regressions
        run: pnpm exec tsx src/components/business/wizard/event/steps/location/eventLocationLeafletMap.test.ts

      - name: Event public rendering regressions
        run: pnpm exec tsx src/components/content/RichContentRenderer.test.ts

      - name: Telegram plan notification regressions
        run: |
          NODE_OPTIONS=--conditions=react-server pnpm exec tsx src/server/services/telegram/telegramNotificationBootstrap.service.test.ts
          pnpm exec tsx src/lib/my-plan/planItemTimezoneRepair.test.ts
          bash -n scripts/deploy/run-prod-notification-jobs.sh
          bash -n scripts/deploy/install-prod-notification-cron.sh

      - name: Telegram recommendation policy regressions
        run: pnpm exec tsx src/server/services/recommendations/telegramSurfacePolicy.test.ts

      - name: Password reset regressions
        run: pnpm exec tsx src/server/auth/passwordResetFlow.test.ts

      - name: External analytics contract regressions
        run: |
          pnpm exec tsx src/lib/analytics/externalAnalyticsConfig.test.ts
          pnpm exec tsx src/lib/analytics/externalAnalyticsContract.test.ts

      - name: SEO indexing regressions
        run: |
          pnpm exec tsx src/server/ops/metrics/collectors/googleSearchConsole.test.ts
          pnpm exec tsx src/lib/seo/globalNoindex.test.ts
          pnpm exec tsx src/app/robots.test.ts
          pnpm exec tsx src/lib/seo/indexingPolicy.test.ts
          pnpm exec tsx src/server/public/publicContentVisibility.test.ts
          pnpm exec tsx src/lib/slug/slugFlow.test.ts
          pnpm exec tsx src/lib/seo/schema/buildPlaceJsonLd.test.ts
          pnpm exec tsx src/lib/seo/schema/buildEventJsonLd.test.ts
          pnpm exec tsx src/lib/routing/legacyProdPreviewRedirect.test.ts
          pnpm exec tsx src/lib/routing/subdomainMiddleware.test.ts
          pnpm exec tsx scripts/verify-prelaunch-seo.test.ts
          pnpm exec tsx scripts/verify-indexing-release.test.ts
          pnpm exec tsx src/lib/seo/migratedArticlePublicationGeoRecovery.test.ts

      - name: Imported media source privacy regression
        run: pnpm exec tsx src/lib/media/importedMediaPrivacy.test.ts
