name: Verify DEV deployed release
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Git commit SHA baked into the deployed image (40 lowercase hex)
        required: true
        type: string
      build_id:
        description: Immutable DEV image tag (dev-N)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify live DEV health provenance
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BUILD: ${{ inputs.build_id }}
        run: node scripts/release/verify-dev-runtime.mjs https://dev.mamago.by/api/health "$EXPECTED_SHA" "$EXPECTED_BUILD"
