name: Recurring task PostgreSQL integration
on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/recurrence-db-integration.yml"
      - "src/server/services/recurringTask.service.ts"
      - "src/server/services/recurringTask.postgres.integration.test.ts"
      - "src/lib/plan/recurrence*"
      - "src/server/family/**"
      - "src/app/api/plan/manual/recurring/**"
      - "prisma/**"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/recurrence-db-integration.yml"
      - "src/server/services/recurringTask.service.ts"
      - "src/server/services/recurringTask.postgres.integration.test.ts"
      - "prisma/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recurrence-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mamago_recurrence_it
        ports:
          - 55444:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mamago_recurrence_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55444/mamago_recurrence_it
      NODE_ENV: test
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate disposable DB
        run: pnpm exec prisma migrate deploy
      - name: Test concurrent recurrence writes
        run: NODE_OPTIONS=--conditions=react-server pnpm exec tsx src/server/services/recurringTask.postgres.integration.test.ts
