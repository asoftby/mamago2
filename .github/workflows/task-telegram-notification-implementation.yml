          cat > src/server/notifications/jobs/run-plan-tomorrow-digests-core.ts <<'TS'
          import { addDaysLocal } from "@/lib/date/localDateKey";
          import type { SendNotificationResult } from "@/lib/notifications/domainContracts";
          import { getTimeZoneDateKey } from "@/lib/notifications/userNotificationSchedule";
          import type { PlanTomorrowDigestCandidate } from "@/server/services/plan.service";

          const DEFAULT_CITY_SLUG = "minsk";

          export type RunPlanTomorrowDigestsArgs = {
            now?: Date;
            limit?: number;
          };

          type DueEveningSchedule = {
            userId: string;
            timeZone: string;
            planEveningTime: string;
            planEveningNextRunAt: Date;
          };

          type RunPlanTomorrowDigestsDeps = {
            listDueEveningSchedulesFn: (args: {
              now: Date;
              limit?: number;
            }) => Promise<DueEveningSchedule[]>;
            listPlanItemsForUserDatesFn: (
              requests: Array<{ userId: string; date: string }>,
            ) => Promise<PlanTomorrowDigestCandidate[]>;
            advancePlanEveningScheduleFn: (userId: string, now: Date) => Promise<void>;
            sendNotificationFn: (input: {
              scenario: "PLAN_TOMORROW_DIGEST";
              userId: string;
              context: {
                digestDate: string;
                citySlug?: string | null;
                planItemIds: string[];
                timeZone?: string;
                items: Array<{
                  planItemId: string;
                  activityId?: string | null;
                  eventTitle: string;
                  startsAt?: Date | null;
                  placeName?: string | null;
                  cityName?: string | null;
                }>;
              };
            }) => Promise<SendNotificationResult>;
          };

          export type RunPlanTomorrowDigestsResult = {
            usersProcessed: number;
            messagesSent: number;
            planItemsIncluded: number;
            skippedNoPlan: number;
            skippedStale: number;
            skippedDuplicate: number;
            errors: Array<{ userId: string; message: string }>;
          };

          function resolvePlaceName(candidate: PlanTomorrowDigestCandidate): string | null {
            return (
              candidate.activity?.place?.customAddress ||
              candidate.activity?.place?.shortAddress ||
              candidate.activity?.place?.formattedAddr ||
              candidate.activity?.venue?.addressLine ||
              candidate.activity?.venue?.place?.customAddress ||
              candidate.activity?.venue?.place?.shortAddress ||
              candidate.activity?.venue?.place?.formattedAddr ||
              null
            );
          }

          function resolveCityName(candidate: PlanTomorrowDigestCandidate): string | null {
            return (
              candidate.activity?.place?.city?.name ||
              candidate.activity?.venue?.place?.city?.name ||
              null
            );
          }

          function resolveEventTitle(candidate: PlanTomorrowDigestCandidate): string {
            return candidate.activity?.title ?? candidate.title ?? "Активность";
          }

          export async function runPlanTomorrowDigestsCore(
            args: RunPlanTomorrowDigestsArgs,
            deps: RunPlanTomorrowDigestsDeps,
          ): Promise<RunPlanTomorrowDigestsResult> {
            const now = args.now ?? new Date();
            const dueSchedules = await deps.listDueEveningSchedulesFn({
              now,
              limit: args.limit,
            });

            const requests = dueSchedules.map((schedule) => ({
              userId: schedule.userId,
              date: addDaysLocal(
                getTimeZoneDateKey(schedule.planEveningNextRunAt, schedule.timeZone),
                1,
              ),
            }));
            const candidates = await deps.listPlanItemsForUserDatesFn(requests);
            const candidatesByUser = new Map<string, PlanTomorrowDigestCandidate[]>();
            for (const candidate of candidates) {
              const bucket = candidatesByUser.get(candidate.userId) ?? [];
              bucket.push(candidate);
              candidatesByUser.set(candidate.userId, bucket);
            }

            let messagesSent = 0;
            let planItemsIncluded = 0;
            let skippedNoPlan = 0;
            let skippedStale = 0;
            let skippedDuplicate = 0;
            const errors: RunPlanTomorrowDigestsResult["errors"] = [];

            for (const [index, schedule] of dueSchedules.entries()) {
              const targetDate = requests[index]!.date;
              const localToday = getTimeZoneDateKey(now, schedule.timeZone);
              const userCandidates = candidatesByUser.get(schedule.userId) ?? [];

              try {
                // If the worker was unavailable across midnight, do not send a stale
                // "tomorrow" digest after tomorrow has already become today.
                if (localToday >= targetDate) {
                  skippedStale += 1;
                  continue;
                }

                if (userCandidates.length === 0) {
                  skippedNoPlan += 1;
                  continue;
                }

                const sortedCandidates = userCandidates.slice().sort((left, right) => {
                  const leftTs = left.startsAt?.getTime() ?? Number.MAX_SAFE_INTEGER;
                  const rightTs = right.startsAt?.getTime() ?? Number.MAX_SAFE_INTEGER;
                  return leftTs - rightTs;
                });

                const result = await deps.sendNotificationFn({
                  scenario: "PLAN_TOMORROW_DIGEST",
                  userId: schedule.userId,
                  context: {
                    digestDate: targetDate,
                    citySlug: DEFAULT_CITY_SLUG,
                    timeZone: schedule.timeZone,
                    planItemIds: sortedCandidates.map((candidate) => candidate.id),
                    items: sortedCandidates.map((candidate) => ({
                      planItemId: candidate.id,
                      activityId: candidate.activityId,
                      eventTitle: resolveEventTitle(candidate),
                      startsAt: candidate.startsAt,
                      placeName: resolvePlaceName(candidate),
                      cityName: resolveCityName(candidate),
                    })),
                  },
                });

                if (result.status === "SKIPPED") {
                  skippedDuplicate += 1;
                  continue;
                }

                if (result.deliveries.some((delivery) => delivery.status === "SENT")) {
                  messagesSent += 1;
                  planItemsIncluded += sortedCandidates.length;
                }
              } catch (error) {
                errors.push({
                  userId: schedule.userId,
                  message:
                    error instanceof Error ? error.message : "PLAN_TOMORROW_DIGEST_FAILED",
                });
              } finally {
                try {
                  await deps.advancePlanEveningScheduleFn(schedule.userId, now);
                } catch (error) {
                  errors.push({
                    userId: schedule.userId,
                    message:
                      error instanceof Error ? error.message : "PLAN_EVENING_ADVANCE_FAILED",
                  });
                }
              }
            }

            return {
              usersProcessed: dueSchedules.length,
              messagesSent,
              planItemsIncluded,
              skippedNoPlan,
              skippedStale,
              skippedDuplicate,
              errors,
            };
          }
          TS

