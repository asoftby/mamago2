          cat > docs/notifications-scheduler.md <<'MD'
          # Плановые уведомления

          `notifications:plan-reminders` и `notifications:plan-tomorrow-digests` должны запускаться внешним scheduler не реже одного раза в **5 минут**.

          Это не cron на пользователя. Оба job делают ограниченные индексированные выборки:

          - reminders: только `PlanItem.startsAt` в ближайшем окне до 3 часов, затем применяет персональный offset пользователя;
          - evening digest: только `UserNotificationSchedule.planEveningNextRunAt <= now`, максимум 250 due-пользователей за один проход, после чего одним batch-запросом читает их план на нужные локальные даты.

          Пользовательские defaults: вечер накануне в 19:00 и напоминание за 2 часа. Для роли ADMIN дополнительно разрешён offset 5 минут, чтобы проверять настоящий delivery pipeline на реальных данных.
          MD

