name: Docker Build & Push (Prisma Studio)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'Dockerfile.prisma-studio'
      - 'prisma/**'

jobs:
  build-and-push-studio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Prisma Studio image (dev)
        if: github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prisma-studio
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-studio:dev-${{ github.run_number }}
            ghcr.io/${{ github.repository }}-studio:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Prisma Studio image (prod)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prisma-studio
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-studio:prod-${{ github.run_number }}
            ghcr.io/${{ github.repository }}-studio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
