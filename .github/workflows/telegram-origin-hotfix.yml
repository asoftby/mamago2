name: Telegram Origin PROD Hotfix Checks

on:
  push:
    branches:
      - hotfix/telegram-origin-prod-954
  pull_request:
    branches:
      - release/prod-954-hotfix-review-base

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Telegram Origin and initData regressions
        run: |
          pnpm exec tsx src/app/api/auth/telegram-webapp/route.test.ts
          pnpm exec tsx src/lib/telegram/verifyWebAppInitData.test.ts
      - name: ESLint (changed files)
        run: pnpm exec eslint src/app/api/auth/telegram-webapp/route.ts src/app/api/auth/telegram-webapp/route.test.ts
      - name: TypeScript
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm exec tsc --noEmit
      - name: Production application build
        run: pnpm build:ci
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mamago_ci
