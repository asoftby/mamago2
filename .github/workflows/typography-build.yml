name: Typography Production Build

on:
  pull_request:
    branches: [dev]
    paths:
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "src/lib/fonts.ts"
      - "src/features/birthday/builder/**"
      - "src/components/article/**"
      - ".github/workflows/typography-build.yml"

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: npm run build
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mamago_ci
