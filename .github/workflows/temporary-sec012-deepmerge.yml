name: Temporary SEC-012 deepmerge verification

on:
  push:
    branches:
      - fix/sec-012-dependency-advisories-20260923

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sec-012-dependency-advisories-20260923
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Install exact refreshed graph
        run: pnpm install --frozen-lockfile
      - name: Prisma config compatibility
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mamago_sec012_validation
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate
      - name: Production dependency audit
        shell: bash
        run: |
          pnpm audit --prod --json > audit.json || audit_exit=$?
          audit_exit=${audit_exit:-0}
          node <<'NODE'
          const fs = require("fs");
          const a = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2));
          const advisories = Object.values(a.advisories || {});
          for (const x of advisories) {
            console.log(JSON.stringify({
              ghsa: x.github_advisory_id,
              module: x.module_name,
              severity: x.severity,
              findings: (x.findings || []).map(f => ({version:f.version, paths:f.paths})),
            }));
          }
          NODE
          if [ "$audit_exit" -ne 0 ]; then
            echo "::error::pnpm audit --prod still reports vulnerabilities"
            exit "$audit_exit"
          fi
      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for deepmerge security override"
          git push origin HEAD:fix/sec-012-dependency-advisories-20260923
