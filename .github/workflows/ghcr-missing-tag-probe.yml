name: GHCR missing-tag probe (read-only, audit XR-01)

# Read-only: inspects tags, never creates, retags or deletes anything.
on:
  push:
    branches:
      - audit/ghcr-probe-20261127

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/asoftby/mamago2
      MISSING_TAG: prod-999999999
      EXISTING_TAG: uat-20261126-37dc217faf28
    steps:
      - name: Log in to GHCR (read)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Inspect existing and missing tags
        shell: bash
        run: |
          set -uo pipefail
          inspect() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          echo "== existing $IMAGE:$EXISTING_TAG"
          existing=$(inspect "$IMAGE:$EXISTING_TAG" 2>&1); echo "exit=$?"; printf '%s' "$existing" | od -c | tail -3; echo "value=[$existing]"
          echo "== missing $IMAGE:$MISSING_TAG"
          missing=$(inspect "$IMAGE:$MISSING_TAG" 2>&1); code=$?; echo "exit=$code"
          printf '%s' "$missing" | od -c
          echo "value=[$missing]"
          if [[ "$missing" == "ERROR: $IMAGE:$MISSING_TAG: not found" ]]; then echo "VERDICT: exact single-line not-found (new promote-image.sh accepts)"; fi
          if [[ "$missing" =~ ^ERROR:[[:space:]]+.*:[[:space:]]+manifest[[:space:]]unknown$ ]]; then echo "VERDICT: manifest unknown (old promote-image.sh accepts)"; else echo "VERDICT: old promote-image.sh would REFUSE"; fi
