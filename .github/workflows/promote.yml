name: Promote DEV image to PROD

# Registry-side promotion only: aliases an already-built dev-* image as a
# prod-* tag via `docker buildx imagetools create` (a manifest copy), with
# no Docker build step anywhere in this workflow. This is what makes
# `dev commit -> one immutable image -> DEV -> promote exact digest -> PROD`
# hold — the source image built by docker.yml is never rebuilt, only
# re-tagged. This workflow never touches the deploy host: it only writes to
# the container registry. Pulling/restarting the actual DEV/PROD containers
# remains the owner-only, Telegram-triggered step documented in
# docs/release/task15-deployment-rollback-runbook.md.
on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Source tag to promote, e.g. dev-373 (must already exist in GHCR)"
        required: true
        type: string
      prod_tag:
        description: "Destination tag to create, e.g. prod-153"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect source digest
        id: source
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ inputs.dev_tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          revision=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ inputs.dev_tag }}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || echo "unknown")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Source: ghcr.io/${{ github.repository }}:${{ inputs.dev_tag }}"
          echo "Source digest:   $digest"
          echo "Source revision: $revision"

      - name: Create prod-* alias (registry-side, no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ inputs.prod_tag }}" \
            "ghcr.io/${{ github.repository }}:${{ inputs.dev_tag }}"

      - name: Inspect destination digest
        id: dest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ inputs.prod_tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Destination: ghcr.io/${{ github.repository }}:${{ inputs.prod_tag }}"
          echo "Destination digest: $digest"

      - name: Fail if digest changed (promotion must be an exact copy)
        run: |
          if [ "${{ steps.source.outputs.digest }}" != "${{ steps.dest.outputs.digest }}" ]; then
            echo "::error::Digest mismatch after promotion — source ${{ steps.source.outputs.digest }} != destination ${{ steps.dest.outputs.digest }}. This must never happen for a registry-side tag copy; treat as a promotion failure, not a warning."
            exit 1
          fi
          echo "Digest match confirmed: ${{ steps.source.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### Promotion complete"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source tag | \`${{ inputs.dev_tag }}\` |"
            echo "| Destination tag | \`${{ inputs.prod_tag }}\` |"
            echo "| Git revision | \`${{ steps.source.outputs.revision }}\` |"
            echo "| Immutable digest | \`${{ steps.dest.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
