name: Promote DEV image to PROD
on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Source build tag (dev-N)"
        required: true
        type: string
      prod_tag:
        description: "Unused destination tag (prod-N)"
        required: true
        type: string
      expected_digest:
        description: "Verified DEV manifest digest (sha256:...)"
        required: true
        type: string

concurrency:
  group: mamago-prod-image-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'asoftby/mamago2' && github.ref == 'refs/heads/dev' && github.actor == 'asoftby' && github.triggering_actor == 'asoftby'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      DEV_TAG: ${{ inputs.dev_tag }}
      PROD_TAG: ${{ inputs.prod_tag }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
      IMAGE: ghcr.io/asoftby/mamago2
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$DEV_TAG" =~ ^dev-[0-9]+$ ]]
          [[ "$PROD_TAG" =~ ^prod-[0-9]+$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Checkout exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Promote exact digest
        run: bash scripts/release/promote-image.sh
