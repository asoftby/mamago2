name: Billing financial integration
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  billing-financial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_test
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_test -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://billing_test:synthetic_only@127.0.0.1:5432/billing_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - name: Financial integration tests
        run: NODE_OPTIONS=--conditions=react-server pnpm exec tsx --test src/server/services/billing/billingFinancial.integration.test.ts
