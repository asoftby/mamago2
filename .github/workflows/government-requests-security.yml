name: Government request registry security

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "src/server/compliance/**"
      - "src/app/api/admin/government-requests/**"
      - "src/app/admin/security/government-requests/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/government-requests-security.yml"

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate additive Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      - name: Government request policy regression tests
        run: node --import tsx --test src/server/compliance/governmentRequests.policy.test.ts
      - name: Government request service authorization and audit tests
        run: node --conditions=react-server --import tsx --test src/server/compliance/governmentRequests.service.test.ts
